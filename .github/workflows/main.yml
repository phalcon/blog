name: CI

on:
  push:
    # Every branch runs the checks. `production` carries the built site only,
    # with no package.json, so the deploy push must not start a run.
    branches-ignore:
      - production
  pull_request:
  workflow_dispatch:

# The deploy step pushes the built site to another branch.
permissions:
  contents: write

# Two runs must not publish at the same time: a run waits for the one before it.
# Each branch has its own group, because a group keeps only one waiting run: a
# pull request run must not cancel a waiting master run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # The branch Cloudflare Pages serves. It holds the built site only.
  DEPLOY_BRANCH: production

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Get the design tools
        # src/lib/design-checks.mjs, src/lib/design-refresh.mjs and src/lib/stars.mjs
        # are copies of phalcon/tools/ in phalcon/assets: the checks and the refresh
        # of the design files, and the star count of the nav, the same on every
        # Phalcon site. A download that fails,
        # a file that is not valid JavaScript, or a file that lacks an export of
        # the committed copy keeps the committed copy. The design files and the
        # tests that come next use the new tools.
        env:
          # Exits with 0 when the first file has every export of the second one.
          EXPORTS: >-
            const [next, last] = await Promise.all(process.argv.slice(1).map((file) => import(process.cwd() + '/' + file)));
            process.exit(Object.keys(last).every((name) => name in next) ? 0 : 1);
        run: |
          for file in design-checks.mjs design-refresh.mjs stars.mjs; do
            new="src/lib/${file%.mjs}.new.mjs"

            if curl -fsSL --max-time 30 -o "$new" "https://assets.phalcon.io/phalcon/tools/$file" && node --check "$new" \
              && node --input-type=module -e "$EXPORTS" "$new" "src/lib/$file"; then
              mv "$new" "src/lib/$file"
            else
              rm -f "$new"
              echo "::warning title=Design tools::$file: the committed copy is used"
            fi
          done

      - name: Get the design tokens
        # public/css/tokens.css, src/code-theme.json, public/css/common.css,
        # src/footer.json and src/repositories.json are copies of
        # phalcon/css/tokens.css, phalcon/css/code-theme.json,
        # phalcon/css/common.css, phalcon/footer.json and
        # phalcon/repositories.json in phalcon/assets. The script keeps a
        # committed copy, with a warning, when its download fails or the file
        # is not correct (for example, a token that the blog uses is missing).
        # It does not commit. It runs before the tests, so that they check the
        # files that the build uses.
        run: node scripts/update-tokens.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the content parses as MDX
        run: node mdx-lint.mjs

      - name: Check types
        run: npx astro check

      - name: Get the fan art
        run: |
          curl -fsSL -o src/fanart.html \
            https://assets.phalcon.io/phalcon/fanart-fragment.html \
            || echo "Download failed, the committed fan art is used"

      - name: Get the sponsors
        # Generated into phalcon/assets by its own scheduled workflow. The
        # committed src/sponsors.json is the fallback when the download fails.
        run: |
          curl -fsSL -o src/sponsors.json \
            https://assets.phalcon.io/phalcon/sponsors.json \
            || echo "Download failed, the committed roster is used"

      - name: Build
        run: npm run build

      - name: Verify the build
        run: npm run verify

      - name: Publish to the deploy branch
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        # dist/_redirects (copied from public/) carries the archive, pagination
        # and legacy redirects, so the deployment is self-contained.
        run: |
          git config user.name niden
          git config user.email nikos@niden.net

          # Absolute, and outside the checkout: a relative ../deploy would land
          # inside the repository and rsync --delete would be operating in the
          # checkout.
          DEPLOY_DIR="${{ runner.temp }}/deploy"

          if git ls-remote --exit-code --heads origin "${DEPLOY_BRANCH}" > /dev/null 2>&1; then
              git fetch --no-tags --prune --depth=1 \
                  origin "+refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
              git worktree add "${DEPLOY_DIR}" "origin/${DEPLOY_BRANCH}"
          else
              echo "${DEPLOY_BRANCH} does not exist yet; starting it"
              git worktree add --detach "${DEPLOY_DIR}"
              git -C "${DEPLOY_DIR}" checkout --orphan "${DEPLOY_BRANCH}"
              git -C "${DEPLOY_DIR}" rm -rf --quiet . || true
          fi

          rsync -a --delete --exclude .git dist/ "${DEPLOY_DIR}/"
          touch "${DEPLOY_DIR}/.nojekyll"
          git -C "${DEPLOY_DIR}" add -A
          git -C "${DEPLOY_DIR}" commit -m "Deployed ${GITHUB_SHA::7}" || echo "No changes to deploy"
          git -C "${DEPLOY_DIR}" push origin "HEAD:${DEPLOY_BRANCH}"
